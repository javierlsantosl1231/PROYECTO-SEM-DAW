{% extends "base.html" %}
{% block title %}Proveedores - AZhadkiel{% endblock %}
{% block content %}
<div class="bg-white p-4 rounded-4 shadow-sm border mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">Directorio de proveedores</h2>
        <span class="badge bg-warning text-dark fs-6 px-3 py-2">Total: {{ proveedores|length }}</span>
    </div>
    <div class="row g-4">
        {% for prov in proveedores %}
        <div class="col-md-4">
            <div class="card card-custom h-100 p-3 border shadow-sm">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-info">{{ prov.nombre }}</h5>
                    <p class="card-text text-secondary mb-1"><strong>Servicio:</strong> {{ prov.servicio }}</p>
                    <p class="card-text text-muted small"><strong>Origen:</strong> {{ prov.pais }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
