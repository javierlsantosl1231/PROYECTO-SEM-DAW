{% extends "base.html" %}
{% block title %}Registro - CyberSecurity AZhadkiel{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h3 class="fw-bold text-center mb-4">Registrar Nuevo Usuario</h3>
            <form action="{{ url_for('registro') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 shadow-sm">Crear Cuenta</button>
            </form>
            <div class="text-center mt-3">
                <p class="text-muted small">¿Ya tienes una cuenta? <a href="{{ url_for('login') }}" class="text-decoration-none">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
